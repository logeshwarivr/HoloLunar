let scene, camera, renderer, terrainMesh;
let heightData, width, height;
const EXAG_BASE = 60; // base vertical exaggeration scale in world units

const scene3 = new THREE.Scene();
scene3.background = new THREE.Color(0x000005);

const camera3 = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 5000);
camera3.position.set(0, 220, 320);

const renderer3 = new THREE.WebGLRenderer({ antialias: true });
renderer3.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer3.domElement);

// Lighting
const ambient = new THREE.AmbientLight(0x888888);
scene3.add(ambient);
const sunLight = new THREE.DirectionalLight(0xffffff, 1.1);
sunLight.position.set(150, 300, 100);
scene3.add(sunLight);
const rimLight = new THREE.DirectionalLight(0x8899ff, 0.3);
rimLight.position.set(-200, 100, -200);
scene3.add(rimLight);

// Star field
function addStars() {
  const starGeo = new THREE.BufferGeometry();
  const starCount = 2000;
  const positions = new Float32Array(starCount*3);
  for (let i=0;i<starCount;i++) {
    positions[i*3] = (Math.random()-0.5)*4000;
    positions[i*3+1] = Math.random()*2000;
    positions[i*3+2] = (Math.random()-0.5)*4000;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  const starMat = new THREE.PointsMaterial({ color:0xffffff, size:1.2 });
  scene3.add(new THREE.Points(starGeo, starMat));
}
addStars();

let currentExag = 1.0;
let currentOpacity = 0.75;
let overlayVisible = true;
let confTexture = null;
let baseMaterial = null;

function loadImageData(src, callback) {
  const img = new Image();
  img.onload = function() {
    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const data = ctx.getImageData(0,0,img.width, img.height);
    callback(data, img.width, img.height);
  };
  img.src = src;
}

function buildTerrain(heightImageData, w, h) {
  width = w; height = h;
  heightData = new Float32Array(w*h);
  const d = heightImageData.data;
  for (let i=0;i<w*h;i++) {
    heightData[i] = d[i*4] / 255.0; // red channel, 0-1
  }

  const segW = w - 1, segH = h - 1;
  const geometry = new THREE.PlaneGeometry(300, 300, segW, segH);
  geometry.rotateX(-Math.PI/2);

  const posAttr = geometry.attributes.position;
  for (let i=0;i<posAttr.count;i++) {
    const hVal = heightData[i];
    posAttr.setY(i, hVal * EXAG_BASE * currentExag);
  }
  geometry.computeVertexNormals();

  // load height as base color texture (grayscale terrain shading)
  const heightTex = new THREE.TextureLoader().load(heightImgData);
  heightTex.wrapS = THREE.ClampToEdgeWrapping;
  heightTex.wrapT = THREE.ClampToEdgeWrapping;

  baseMaterial = new THREE.MeshStandardMaterial({
    map: heightTex,
    color: 0xaaaaaa,
    roughness: 0.95,
    metalness: 0.0,
    flatShading: false
  });

  terrainMesh = new THREE.Mesh(geometry, baseMaterial);
  scene3.add(terrainMesh);

  // Overlay plane (ice confidence), slightly above terrain, using vertex displacement copy
  loadImageData(confImgData, function(confData) {
    const overlayGeo = geometry.clone();
    const overlayTex = new THREE.TextureLoader().load(confImgData);
    // Colorize: build a canvas that maps grayscale -> blue(low)-to-red(high) colormap
    const canvas = document.createElement('canvas');
    canvas.width = confData.width;
    canvas.height = confData.height;
    const ctx = canvas.getContext('2d');
    const outImg = ctx.createImageData(confData.width, confData.height);
    for (let i=0;i<confData.width*confData.height;i++) {
      const v = confData.data[i*4]/255.0;
      // colormap: blue -> cyan -> yellow -> red
      let r,g,b;
      if (v < 0.33) { r=0; g=Math.floor(v/0.33*255); b=255; }
      else if (v < 0.66) { const t=(v-0.33)/0.33; r=Math.floor(t*255); g=255; b=Math.floor((1-t)*255); }
      else { const t=(v-0.66)/0.34; r=255; g=Math.floor((1-t)*255); b=0; }
      outImg.data[i*4] = r;
      outImg.data[i*4+1] = g;
      outImg.data[i*4+2] = b;
      outImg.data[i*4+3] = Math.floor(currentOpacity*255);
    }
    ctx.putImageData(outImg,0,0);
    const colorTex = new THREE.CanvasTexture(canvas);

    const overlayMat = new THREE.MeshBasicMaterial({
      map: colorTex,
      transparent: true,
      opacity: currentOpacity,
      depthWrite: false
    });
    const overlayMesh = new THREE.Mesh(overlayGeo, overlayMat);
    overlayMesh.position.y = 0.6; // tiny offset to avoid z-fighting
    overlayMesh.userData.isOverlay = true;
    scene3.add(overlayMesh);

    window._overlayMesh = overlayMesh;
    window._overlayMat = overlayMat;
  });

  // center camera target roughly at terrain center height
  controlsTarget.set(0, 20, 0);
}

loadImageData(heightImgData, buildTerrain);

// Simple orbit controls (manual, no extra library needed)
let isDragging = false;
let prevX=0, prevY=0;
let camAngleX = 0.5, camAngleY = 0.6, camDist = 380;
const controlsTarget = new THREE.Vector3(0,20,0);

function updateCamera() {
  camera3.position.x = controlsTarget.x + camDist * Math.sin(camAngleY) * Math.cos(camAngleX);
  camera3.position.y = controlsTarget.y + camDist * Math.sin(camAngleX);
  camera3.position.z = controlsTarget.z + camDist * Math.cos(camAngleY) * Math.cos(camAngleX);
  camera3.lookAt(controlsTarget);
}
updateCamera();

renderer3.domElement.addEventListener('mousedown', (e) => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - prevX;
  const dy = e.clientY - prevY;
  camAngleY -= dx * 0.005;
  camAngleX += dy * 0.005;
  camAngleX = Math.max(-1.3, Math.min(1.3, camAngleX));
  prevX = e.clientX; prevY = e.clientY;
  updateCamera();
});
renderer3.domElement.addEventListener('wheel', (e) => {
  camDist += e.deltaY * 0.3;
  camDist = Math.max(60, Math.min(1200, camDist));
  updateCamera();
}, { passive:true });

// Touch support for mobile
let lastTouchDist = null;
renderer3.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    isDragging = true;
    prevX = e.touches[0].clientX;
    prevY = e.touches[0].clientY;
  }
});
renderer3.domElement.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 1 && isDragging) {
    const dx = e.touches[0].clientX - prevX;
    const dy = e.touches[0].clientY - prevY;
    camAngleY -= dx * 0.005;
    camAngleX += dy * 0.005;
    camAngleX = Math.max(-1.3, Math.min(1.3, camAngleX));
    prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
    updateCamera();
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    if (lastTouchDist !== null) {
      camDist += (lastTouchDist - dist) * 0.5;
      camDist = Math.max(60, Math.min(1200, camDist));
      updateCamera();
    }
    lastTouchDist = dist;
  }
}, { passive:false });
renderer3.domElement.addEventListener('touchend', () => { isDragging = false; lastTouchDist = null; });

window.addEventListener('resize', () => {
  camera3.aspect = window.innerWidth/window.innerHeight;
  camera3.updateProjectionMatrix();
  renderer3.setSize(window.innerWidth, window.innerHeight);
});

document.getElementById('toggleOverlay').addEventListener('change', (e) => {
  overlayVisible = e.target.checked;
  if (window._overlayMesh) window._overlayMesh.visible = overlayVisible;
});
document.getElementById('opacitySlider').addEventListener('input', (e) => {
  currentOpacity = parseFloat(e.target.value);
  if (window._overlayMat) window._overlayMat.opacity = currentOpacity;
});
document.getElementById('exagSlider').addEventListener('input', (e) => {
  currentExag = parseFloat(e.target.value);
  if (terrainMesh && heightData) {
    const posAttr = terrainMesh.geometry.attributes.position;
    const overlayPos = window._overlayMesh ? window._overlayMesh.geometry.attributes.position : null;
    for (let i=0;i<posAttr.count;i++) {
      const hVal = heightData[i];
      posAttr.setY(i, hVal * EXAG_BASE * currentExag);
      if (overlayPos) overlayPos.setY(i, hVal * EXAG_BASE * currentExag);
    }
    posAttr.needsUpdate = true;
    terrainMesh.geometry.computeVertexNormals();
    if (overlayPos) overlayPos.needsUpdate = true;
  }
});

function animate() {
  requestAnimationFrame(animate);
  renderer3.render(scene3, camera3);
}
animate();
</script>
